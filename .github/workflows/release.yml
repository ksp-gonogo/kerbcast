name: release

# Triggered on v* tags. Linked jobs:
#
#   version-sync   (~10 s)    on a tag, checks the tag against Cargo.toml, both
#                             package.json files, Versions.props and the AVC
#                             files. Everything that publishes waits for it.
#   nuget-pack     (~2 min)   packs KspGonogo.Kerbcast.API and
#                             KspGonogo.Kerbcast.API.Testing once, gates their
#                             contents, builds a stand-in mod against them
#                             outside the repo (and proves a planted gap fails
#                             it), and decides per package whether to publish
#                             or skip. Every publishing job below waits for it,
#                             so a bad package stops the release before anything
#                             ships.
#   publish-sdk    (~1 min)   regenerates the typeshare bindings from Rust,
#                             verifies version sync, publishes @ksp-gonogo/kerbcast
#                             and @ksp-gonogo/kerbcast-react to public npm via
#                             OIDC trusted publishing. Runs after publish-nuget,
#                             so a failed NuGet push ships no npm package.
#   build-sidecar  (matrix)   builds one sidecar per supported runtime — Linux
#                             (tier-1 libva, glibc-floored + lib-bundled), macOS
#                             arm64 and Windows x64 (tier-2 software encode, no
#                             native deps) — and uploads each as a per-rid
#                             artifact.
#   build-windows-shaders     builds the kerbcast-shaders.windows bundle on a
#                  (~15 min)  windows-2022 runner with the native Windows
#                             shader compiler, then smoke-renders its d3d11
#                             variants on a real D3D11 device. The Linux
#                             editor's d3d11 cross-compile shipped invalid
#                             vertex shader blobs in v0.19.0 (E_INVALIDARG at
#                             draw time, black NightVision streams); see
#                             build-kerbcast-shaders.yml for the full story.
#   build-native-readback     builds libAsyncGPUReadbackPlugin.so (the Linux
#                  (~1 min)   OpenGL readback library) from pinned upstream
#                             source on ubuntu-22.04, checks it, and reads a
#                             texture back through it on a real GL context.
#   bundle         (~11 min)  collects the per-rid sidecar artifacts, the
#                             Windows shader bundle and the readback library,
#                             builds the plugin DLL + Linux/macOS shader bundles,
#                             assembles the complete GameData/Kerbcast/ install
#                             tree, refuses to continue if the release zip lacks
#                             a valid readback library, and uploads the zips as
#                             the kerbcast-release-bundle artifact.
#   publish-nuget  (~1 min)   pushes the packages nuget-pack gated, the very
#                             files, via OIDC trusted publishing. Waits for the
#                             bundle so a failed GameData build never leaves a
#                             package out with no release behind it.
#   nuget-listed   (0-45 min) waits until nuget.org lists what was pushed, so
#                             nobody reads the release before the package
#                             restores, then checks nuget.org serves these files.
#   publish        (~1 min)   creates the GitHub Release from that artifact and
#                             mirrors it to SpaceDock and the .ckan pins. needs
#                             publish-sdk and nuget-listed so a Release never
#                             claims packages that failed to publish.
#
# Dry run: a manual dispatch defaults to dry_run=true, which skips publish-sdk,
# publish-nuget, nuget-listed and publish at the job level, so no publishing
# step can run. Only the builds, assemble and gates run, nuget-pack included:
# on any branch, `gh workflow run release.yml --ref <branch>` packs the NuGet
# packages as <KerbcastApiVersion>-rc.<run number>, gates and probes them, and
# says in its summary what a release would publish. The zips and packages are
# downloadable from the run.
#
# "Re-run failed jobs" re-runs whichever half failed without repeating the
# other.
#
# The Linux sidecar build + the bundle/assemble job run on ubuntu-22.04 (glibc
# 2.35) so bundled .so files stay within the Steam Deck's pressure-vessel glibc
# floor (Steam Runtime 3 = glibc 2.36). macOS/Windows sidecars are software-
# encode only (OpenH264, statically built) so they carry no host-glibc concern
# and bundle no sibling libs.
#
# Publishes to public npm under the @ksp-gonogo scope via OIDC trusted
# publishing (npmjs.com trusts this repo's release workflow — no NPM_TOKEN
# stored or rotated). Requires npm >= 11.5.1 and `permissions: id-token: write`.
# npm publish (unlike pnpm publish) does NOT resolve pnpm's workspace: protocol,
# so the publish-sdk job rewrites it to the concrete version first (see the
# "Resolve workspace protocol before publish" step).
#
# Secrets required:
#   NUGET_USER: the nuget.org profile name that owns the ksp-gonogo
#               trusted-publishing policy (an organisation secret)
#   KSP_MANAGED_TOKEN — fine-grained PAT (Contents: read) for ksp-gonogo/ksp-managed
#   UNITY_USERNAME / UNITY_PASSWORD — Unity Personal license for shader builds
#
# Signing secrets (optional — steps skip gracefully when absent, so the build
# still works without certs). All PROPOSED names, not yet provisioned:
#   APPLE_CODESIGN_P12_BASE64 / APPLE_CODESIGN_PASSWORD — Developer ID cert
#   APPLE_CODESIGN_IDENTITY                              — "Developer ID Application: ..."
#   APPLE_NOTARY_KEY_BASE64 / APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER_ID
#                                                       — App Store Connect API key for notarytool
#   WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD     — Authenticode code-signing cert

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, assemble and gate only; publish nothing"
        type: boolean
        default: true

jobs:
  # Every manifest must carry the tag's version. First in the graph, so a
  # mismatched tag fails before nuget-pack plans a push or npm sees anything.
  # A run that is not on a tag has no version to check against.
  version-sync:
    name: versions match the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Not a tag run
        if: github.ref_type != 'tag'
        run: echo "${GITHUB_REF_NAME} is not a tag, so there is no release version to check"

      - name: Verify version sync (tag == Cargo.toml == package.json == Versions.props == Kerbcast.version == KerbcastKos.version)
        if: github.ref_type == 'tag'
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./client-sdk/typescript/package.json').version")"
          REACT_VER="$(node -p "require('./client-sdk/react/package.json').version")"
          CARGO_VER="$(grep -m1 '^version = ' sidecar/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          AVC_VER="$(python3 -c "import json; v=json.load(open('GameData/Kerbcast/Kerbcast.version'))['VERSION']; print(f\"{v['MAJOR']}.{v['MINOR']}.{v['PATCH']}\")")"
          # KerbcastKos is co-versioned with the core (lockstep): the addon
          # compile-time links the Kerbcast.dll facade, so a matching version is
          # the compatibility contract.
          KOS_VER="$(python3 -c "import json; v=json.load(open('GameData/KerbcastKos/KerbcastKos.version'))['VERSION']; print(f\"{v['MAJOR']}.{v['MINOR']}.{v['PATCH']}\")")"
          # Plugin/Versions.props drives Kerbcast.dll's KSPAssembly version, and
          # holds the public API's own SemVer line (Kerbcast.API NuGet packages).
          PLUGIN_VER="$(sed -nE 's|.*<KerbcastVersion>([^<]*)</KerbcastVersion>.*|\1|p' Plugin/Versions.props)"
          API_VER="$(sed -nE 's|.*<KerbcastApiVersion>([^<]*)</KerbcastApiVersion>.*|\1|p' Plugin/Versions.props)"
          echo "tag=$TAG_VER cargo=$CARGO_VER typescript=$PKG_VER react=$REACT_VER plugin=$PLUGIN_VER api=$API_VER avc=$AVC_VER kos=$KOS_VER"
          if ! printf '%s' "$API_VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::KerbcastApiVersion '$API_VER' in Plugin/Versions.props is not X.Y.Z"
            exit 1
          fi
          # The AVC (.version) files are numeric MAJOR/MINOR/PATCH and cannot
          # carry a pre-release suffix, so they are compared against the BASE
          # version: for v1.9.1-rc.1 the tag, Cargo and packages must all read
          # 1.9.1-rc.1 while the AVC files read 1.9.1. Comparing them against
          # the full tag makes a pre-release impossible to cut.
          BASE_VER="${TAG_VER%%-*}"
          if [ "$TAG_VER" != "$CARGO_VER" ] || [ "$TAG_VER" != "$PLUGIN_VER" ] || [ "$CARGO_VER" != "$PKG_VER" ] || [ "$PKG_VER" != "$REACT_VER" ] || [ "$BASE_VER" != "$AVC_VER" ] || [ "$AVC_VER" != "$KOS_VER" ]; then
            echo "::error::version mismatch: run ./scripts/bump-version.sh $TAG_VER and re-tag"
            exit 1
          fi

  publish-sdk:
    name: publish SDK packages
    needs: [version-sync, publish-nuget]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + typeshare binary
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/typeshare
          key: ${{ runner.os }}-typeshare-cli-1.13.4

      - name: Install typeshare-cli
        run: |
          if ! command -v typeshare >/dev/null 2>&1; then
            cargo install typeshare-cli --version 1.13.4 --locked
          fi
          typeshare --version

      # The Rust protocol is the source of truth: publish from a fresh regen,
      # never from the committed copy.
      - name: Regenerate TS bindings
        run: |
          typeshare ./sidecar/src \
            --lang=typescript \
            --output-file=client-sdk/typescript/src/__generated__/types.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
          scope: "@ksp-gonogo"

      # OIDC trusted publishing needs npm >= 11.5.1; setup-node's bundled npm
      # is older than that on the Node 22 runner image.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      # `npm publish` (used below for OIDC) does NOT rewrite pnpm's workspace:
      # protocol the way `pnpm publish` does, so a raw workspace:^ leaked into
      # the published kerbcast-react from 1.5.0 on and made it unresolvable for
      # external consumers. Resolve it to the concrete lockstep version (all
      # packages share the tag version) before publishing, and fail loudly if any
      # workspace: string survives.
      - name: Resolve workspace protocol before publish
        run: |
          export VER="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs"); const ver = process.env.VER;
            for (const dir of ["client-sdk/typescript", "client-sdk/react"]) {
              const f = dir + "/package.json";
              const p = JSON.parse(fs.readFileSync(f, "utf8")); let ch = false;
              for (const k of ["dependencies", "peerDependencies", "optionalDependencies"]) {
                if (!p[k]) continue;
                for (const d of Object.keys(p[k])) {
                  const m = String(p[k][d]).match(/^workspace:(.*)$/); if (!m) continue;
                  const r = m[1];
                  p[k][d] = (r === "*" || r === "") ? ver : (r === "^" || r === "~") ? r + ver : r;
                  ch = true;
                }
              }
              if (ch) { fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n"); console.log("rewrote workspace deps in " + f); }
            }
          '
          if grep -rIl "workspace:" client-sdk/typescript/package.json client-sdk/react/package.json; then
            echo "::error::workspace: protocol still present after rewrite"; exit 1
          fi
          echo "workspace protocol resolved to ^${VER}"

      # Core first so the registry has the dependency when react is indexed.
      # No NODE_AUTH_TOKEN: OIDC trusted publishing authenticates via the
      # id-token permission above, not a stored credential.
      # Skip a version already on the registry rather than failing. A release
      # can need re-running for reasons downstream of publishing (a broken
      # runner image took out the GameData bundle on v1.9.0), and npm refuses to
      # republish a version — so an unguarded publish makes the whole release
      # unrepeatable and strands the bundle behind a job that can never go green
      # again. Publishing itself stays exactly as it was.
      # A pre-release version publishes under the `next` dist-tag, never
      # `latest`: an unqualified `npm install @ksp-gonogo/kerbcast` must keep
      # resolving to the newest STABLE release, not to a test cut.
      - name: Publish @ksp-gonogo/kerbcast to npm
        working-directory: client-sdk/typescript
        run: |
          VER="$(node -p "require('./package.json').version")"
          case "$VER" in *-*) TAG_ARGS="--tag next";; *) TAG_ARGS="";; esac
          if npm view "@ksp-gonogo/kerbcast@${VER}" version >/dev/null 2>&1; then
            echo "@ksp-gonogo/kerbcast@${VER} is already published; skipping"
          else
            npm publish ${TAG_ARGS}
          fi

      - name: Publish @ksp-gonogo/kerbcast-react to npm
        working-directory: client-sdk/react
        run: |
          VER="$(node -p "require('./package.json').version")"
          case "$VER" in *-*) TAG_ARGS="--tag next";; *) TAG_ARGS="";; esac
          if npm view "@ksp-gonogo/kerbcast-react@${VER}" version >/dev/null 2>&1; then
            echo "@ksp-gonogo/kerbcast-react@${VER} is already published; skipping"
          else
            npm publish ${TAG_ARGS}
          fi

  # One sidecar per supported runtime. Linux must build on ubuntu-22.04 (glibc
  # floor) with ffmpeg/libva for the tier-1 libva backend + sibling-lib bundle;
  # macOS and Windows build on their native runners (VideoToolbox/MSVC can't be
  # cross-compiled from Linux) and ship the always-on software encoder only.
  # Each job produces a per-rid artifact whose contents lay out exactly as they
  # land under GameData/Kerbcast/Sidecar/<rid>/ — the assemble job just copies.
  build-sidecar:
    name: build sidecar (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-22.04
            bin: kerbcast-sidecar
          - rid: osx-arm64
            runner: macos-14
            bin: kerbcast-sidecar
          - rid: win-x64
            runner: windows-2022
            bin: kerbcast-sidecar.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      # Tier-1 libva backend needs ffmpeg + VA-API headers/libs at link time;
      # only on Linux (the ffmpeg-next dep is cfg(target_os="linux")-gated).
      - name: Install ffmpeg + VA-API system libs (Linux)
        if: matrix.rid == 'linux-x64'
        timeout-minutes: 35
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config clang libclang-dev
            libavcodec-dev libavutil-dev libavformat-dev
            libavfilter-dev libswscale-dev libva-dev

      # OpenH264's "source" feature compiles the codec's asm — provide an
      # assembler on the platforms that don't ship one in the runner image.
      # (Verified unnecessary on a local aarch64 build, but the CI runner
      # environment differs; cheap insurance on mac/win.)
      - name: Install nasm (macOS)
        if: matrix.rid == 'osx-arm64'
        run: brew install nasm
      - name: Install nasm (Windows)
        if: matrix.rid == 'win-x64'
        uses: ilammy/setup-nasm@v1

      - name: Install stable Rust + components
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sidecar/target
          key: ${{ matrix.rid }}-cargo-${{ hashFiles('sidecar/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.rid }}-cargo-

      - name: Build sidecar
        working-directory: sidecar
        run: cargo build --release

      # Linux: self-contained bundle. Copy the binary + the non-system shared
      # libs it links against (ffmpeg, etc) into lib/, denylisting stable system
      # libs and libva (driver shim, must match host Mesa — see sidecar-ci.yml
      # for the full rationale). The plugin prepends this lib/ to LD_LIBRARY_PATH.
      - name: Stage Linux sidecar + bundled shared libs
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          mkdir -p staging-sidecar/lib
          cp sidecar/target/release/kerbcast-sidecar staging-sidecar/

          deps="$(ldd staging-sidecar/kerbcast-sidecar \
            | awk '/=>/ && $3 ~ /^\// {print $3}' \
            | grep -Ev '/(libc|libm|libpthread|libdl|librt|libstdc\+\+|libgcc_s)[.\-]' \
            | grep -Ev '/(ld-linux|linux-vdso)' \
            | grep -v libva \
            || true)"
          if [ -z "$deps" ]; then
            echo "::error::ldd found no bundleable non-system deps: refusing to upload a non-self-contained artefact"
            ldd staging-sidecar/kerbcast-sidecar
            exit 1
          fi
          echo "Bundling:"
          echo "$deps"
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            real="$(readlink -f "$src")"
            soname="$(basename "$src")"
            cp "$real" "staging-sidecar/lib/$soname"
          done <<< "$deps"

      # macOS/Windows: software encode, no sibling libs. Just the binary.
      - name: Stage macOS/Windows sidecar
        if: matrix.rid != 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-sidecar
          cp "sidecar/target/release/${{ matrix.bin }}" "staging-sidecar/${{ matrix.bin }}"

      # PROPOSED signing — gated on the cert secrets being present so the build
      # works without them. Secrets can't be used directly in `if:`; map to env
      # first. Scaffold only: fills in once certs are provisioned (README TODOs
      # "Codesign and notarise macOS sidecar binaries" / "Establish SmartScreen
      # reputation"). Until then mac binaries are quarantined by Gatekeeper and
      # Windows .exe trips SmartScreen on first run.
      - name: Codesign + notarise (macOS)
        if: matrix.rid == 'osx-arm64'
        shell: bash
        env:
          HAS_SIGNING: ${{ secrets.APPLE_CODESIGN_P12_BASE64 != '' }}
        run: |
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::notice::APPLE_CODESIGN_* secrets absent: shipping unsigned macOS sidecar (Gatekeeper will quarantine)"
            exit 0
          fi
          echo "::error::macOS codesign+notarytool not yet implemented: TODO: import APPLE_CODESIGN_P12_BASE64 into a temp keychain, codesign --options runtime staging-sidecar/${{ matrix.bin }}, then notarytool submit + staple"
          exit 1

      - name: Sign (Windows)
        if: matrix.rid == 'win-x64'
        shell: bash
        env:
          HAS_SIGNING: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::notice::WINDOWS_CERT_PFX_BASE64 absent: shipping unsigned Windows sidecar (SmartScreen friction on first run)"
            exit 0
          fi
          echo "::error::Windows signtool step not yet implemented: TODO: decode WINDOWS_CERT_PFX_BASE64 and signtool sign /fd sha256 /tr <timestamp> staging-sidecar/${{ matrix.bin }}"
          exit 1

      - name: Upload per-rid sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: kerbcast-sidecar-${{ matrix.rid }}
          path: staging-sidecar
          if-no-files-found: error

  # Native-toolchain build of the Windows shader bundle. Mirrors the
  # build-windows job in build-kerbcast-shaders.yml: the 2019.4 Linux editor's
  # d3d11 cross-compile emits vertex shader blobs the Windows D3D11 runtime
  # rejects with E_INVALIDARG while shader.isSupported stays true, so the
  # Windows bundle must come from a Windows editor and be smoke-rendered on a
  # real D3D11 device (the runner's WARP rasterizer validates the bytecode in
  # Create*Shader). Runs in parallel with build-sidecar; the bundle job's own
  # Unity activation happens only after this job releases the license.
  build-windows-shaders:
    name: build Windows shader bundle
    runs-on: windows-2022
    env:
      UNITY_VERSION: 2019.4.40f1 (ffc62b691db5)
    steps:
      - uses: actions/checkout@v6

      # Unity Hub's postinst calls update-desktop-database, which is absent on
      # the runner image. The script fails, the package never finishes
      # configuring, and /opt/unityhub/unityhub is never created — so
      # buildalon/unity-setup dies with ENOENT before Unity starts. This took
      # out the shader workflow from 2026-07-23 and then the v1.9.0 release.
      # Supplying the tool lets the postinst complete.
      - name: Install a Unity Hub version the setup action can find
        # Linux only: apt does not exist on the Windows runner.
        #
        # Hub 3.20 moved its binary to /usr/lib/unityhub/unityhub, while
        # buildalon/unity-setup requires an install at /opt/unityhub/unityhub —
        # and symlinking the expected path is not enough, the action's own
        # is-installed check still rejects it. So pin the newest pre-3.20 Hub,
        # which installs where the action expects. Its postinst also calls
        # update-desktop-database, absent on the runner, so install that first
        # or the package never finishes configuring.
        #
        # This is why the shader workflow had no green run after 2026-07-23 and
        # why the v1.9.0 GameData bundle failed: the runner silently moved to
        # 3.20. Print the candidates so the next drift is visible, not silent.
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils
          wget -qO- https://hub.unity3d.com/linux/keys/public \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg >/dev/null
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/Unity_Technologies_ApS.gpg] https://hub.unity3d.com/linux/repos/deb stable main" > /etc/apt/sources.list.d/unityhub.list'
          sudo apt-get update -qq
          echo "=== available unityhub versions ==="
          apt-cache madison unityhub || true
          VER="$(apt-cache madison unityhub | awk '{print $3}' | grep -v '^3\.20' | head -1)"
          echo "pinning unityhub ${VER:-<none found, using latest>}"
          if [ -n "$VER" ]; then
            # An apt PIN, not apt-mark hold: the setup action runs its own
            # `apt-get install unityhub`, and a hold makes that fail with
            # exit 100. A pin keeps the version fixed while letting the
            # action's install succeed against it.
            printf 'Package: unityhub\nPin: version %s\nPin-Priority: 1001\n' "$VER" \
              | sudo tee /etc/apt/preferences.d/unityhub >/dev/null
            sudo apt-get install -y "unityhub=$VER"
          else
            sudo apt-get install -y unityhub
          fi
          ls -la /opt/unityhub || true
          # The action spawns a binary called `unity-hub` (hyphenated); the
          # package provides `unityhub`. Without this alias it fails with
          # "spawn unity-hub ENOENT" even though Hub is correctly installed.
          if [ -x /opt/unityhub/unityhub ] && [ ! -e /usr/bin/unity-hub ]; then
            sudo ln -sf /opt/unityhub/unityhub /usr/bin/unity-hub
          fi
          command -v unity-hub unityhub || true

      - name: Set up Unity Hub + Editor
        uses: buildalon/unity-setup@v2
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          version-file: "None"
          build-targets: StandaloneWindows64
          # NOT cached: a cache-restored Windows Unity install exits
          # instantly without writing a log (run 27330133502); see
          # build-kerbcast-shaders.yml. Fresh install ~10 min per release.
          cache-installation: false

      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v2
        with:
          license: "Personal"
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build kerbcast-shaders AssetBundle (windows)
        working-directory: ci/kerbcast-shaders
        shell: bash
        run: |
          status=0
          "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.BuildKerbcastShaders.BuildWindows \
            -buildTarget Win64 \
            -logFile unity-build.log || status=$?
          cat unity-build.log 2>/dev/null || echo "::error::Unity wrote no log (exit $status): editor launch failed before logging"
          [ "$status" -eq 0 ] || exit "$status"
          ls -la Bundles-windows/

      - name: Shader render smoke test (Windows bundle, d3d11)
        working-directory: ci/kerbcast-shaders
        timeout-minutes: 10
        shell: bash
        env:
          KERBCAST_SMOKE_BUNDLE_DIR: Bundles-windows
        run: |
          status=0
          "$UNITY_EDITOR_PATH" \
            -batchmode -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.ShaderSmoke.RenderAll \
            -buildTarget Win64 \
            -logFile unity-smoke.log || status=$?
          cat unity-smoke.log 2>/dev/null || echo "::error::Unity wrote no log (exit $status): editor launch failed before logging"
          exit "$status"

      - name: Upload Windows shader bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: kerbcast-shaders-windows
          path: ci/kerbcast-shaders/Bundles-windows/kerbcast-shaders
          if-no-files-found: error

  build-native-readback:
    name: build native readback library
    # glibc 2.35, the same floor as the Linux sidecar; check.sh enforces it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        timeout-minutes: 35
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            cmake g++ make libgl1-mesa-dev libglu1-mesa-dev binutils
            xvfb xauth libgl1-mesa-dri libx11-dev

      - name: Build and check libAsyncGPUReadbackPlugin.so
        run: Plugin/Vendor/UnityOpenGLAsyncReadback/native/build.sh native-out

      - name: Read a texture back through it on a GL core context
        run: |
          cc -O1 -o gl_readback_smoke \
            Plugin/Vendor/UnityOpenGLAsyncReadback/native/gl_readback_smoke.c -lGL -lX11 -ldl
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./gl_readback_smoke \
            "$PWD/native-out/libAsyncGPUReadbackPlugin.so"

      - name: Upload readback library
        uses: actions/upload-artifact@v7
        with:
          name: native-readback-linux-x64
          path: native-out/
          if-no-files-found: error

  bundle:
    name: GameData bundle
    needs: [build-sidecar, build-windows-shaders, build-native-readback]
    runs-on: ubuntu-22.04
    env:
      UNITY_VERSION: 2019.4.40f1 (ffc62b691db5)
      HULLCAM_REPO: linuxgurugamer/HullcamVDSContinued
      HULLCAM_REF: master
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Collect every per-rid sidecar artifact. download-artifact unpacks each
      # under sidecar-artifacts/<artifact-name>/ preserving the staged layout
      # (binary [+ lib/ for linux]). The assemble step maps name -> rid subdir.
      - name: Download sidecar artifacts
        uses: actions/download-artifact@v8
        with:
          path: sidecar-artifacts
          pattern: kerbcast-sidecar-*

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.x"

      - name: Checkout KSP assemblies
        uses: actions/checkout@v6
        with:
          repository: ksp-gonogo/ksp-managed
          token: ${{ secrets.KSP_MANAGED_TOKEN }}
          path: ksp-managed

      - name: Build Kerbcast.dll
        run: |
          dotnet build Plugin/Kerbcast.csproj -c Release \
            /p:KspManaged="${{ github.workspace }}/ksp-managed/KSP_Data/Managed" \
            /p:KspGameData="${{ github.workspace }}/ksp-managed/GameData"

      # The optional kOS addon. Co-versioned + shipped as its own GameData
      # tree/zip/listing (GPL-3.0, depends kOS). kOS DLLs come from the same
      # ksp-managed checkout the plugin uses.
      - name: Build Kerbcast.Kos.dll
        run: |
          dotnet build Plugin/KerbcastKos/KerbcastKos.csproj -c Release \
            /p:KspManaged="${{ github.workspace }}/ksp-managed/KSP_Data/Managed" \
            /p:KspGameData="${{ github.workspace }}/ksp-managed/GameData"

      - name: Checkout HullcamVDSContinued (shader source)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HULLCAM_REPO }}
          ref: ${{ env.HULLCAM_REF }}
          path: hullcam

      - name: Drop kerbcast build script into HullcamVDS project
        run: |
          mkdir -p hullcam/HullCameraAssets/Assets/Editor
          rm -f hullcam/HullCameraAssets/Assets/Editor/CreateAssetBundles.cs
          cp ci/hullcam-shaders/BuildShaderBundle.cs \
             hullcam/HullCameraAssets/Assets/Editor/BuildShaderBundle.cs

      # Not buildalon/unity-setup: Hub's headless editor install is broken on
      # the current runner image. See the action for the full story.
      - name: Set up Unity (Linux)
        uses: ./.github/actions/setup-unity-linux
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build shaders.linux (HullcamVDS)
        working-directory: hullcam/HullCameraAssets
        run: |
          "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.BuildShaderBundle.BuildLinux \
            -buildTarget Linux64 \
            -logFile -
          cp Bundles-linux/shaders shaders.linux

      - name: Build kerbcast-shaders (linux, osx)
        working-directory: ci/kerbcast-shaders
        run: |
          "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.BuildKerbcastShaders.BuildUnix \
            -buildTarget Linux64 \
            -logFile -

      # The Windows bundle is built (and d3d11-smoke-tested) by the
      # build-windows-shaders job; collect it for the assemble step.
      - name: Download Windows shader bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: kerbcast-shaders-windows
          path: windows-shaders

      - name: Download readback library
        uses: actions/download-artifact@v8
        with:
          name: native-readback-linux-x64
          path: native-readback

      - name: Assemble GameData/Kerbcast
        run: |
          set -euo pipefail
          mkdir -p \
            GameData/Kerbcast/Plugins/linux-x64 \
            GameData/Kerbcast/Sidecar \
            GameData/Kerbcast/HullcamShaders

          cp Plugin/obj/Release/Kerbcast.dll GameData/Kerbcast/Plugins/

          # The MIT interface assembly other mods build against, with its own
          # licence beside it (Kerbcast.dll stays CC BY-NC-SA 4.0).
          cp Plugin/Kerbcast.API/bin/Release/Kerbcast.API.dll GameData/Kerbcast/Plugins/
          cp Plugin/Kerbcast.API/LICENSE GameData/Kerbcast/Plugins/Kerbcast.API.LICENSE.txt

          # Linux OpenGL readback library. The plugin dlopens it from exactly
          # this path (ReadbackGate.NativeLibraryPath) and refuses to start on
          # Linux OpenGL without it.
          cp native-readback/libAsyncGPUReadbackPlugin.so GameData/Kerbcast/Plugins/linux-x64/
          chmod 644 GameData/Kerbcast/Plugins/linux-x64/libAsyncGPUReadbackPlugin.so

          # Per-rid sidecar layout: Sidecar/<rid>/kerbcast-sidecar[.exe] (+ lib/
          # on Linux). Kept in lockstep with ResolveSidecarBinary's rid switch
          # in Plugin/Kerbcast/KerbcastCore.cs. Each artifact dir already holds
          # the staged contents, so a plain recursive copy reproduces the tree.
          #
          # Every supported rid must be present — kerbcast ships for all OSes or
          # not at all. A failed sidecar build already blocks this job (bundle
          # needs build-sidecar), so a missing artifact here means a build
          # succeeded but produced nothing; refuse to cut a partial release.
          for rid in linux-x64 osx-arm64 win-x64; do
            src="sidecar-artifacts/kerbcast-sidecar-${rid}"
            if [ ! -d "$src" ]; then
              echo "::error::missing ${rid} sidecar artifact: refusing to cut a release that omits an OS"
              exit 1
            fi
            mkdir -p "GameData/Kerbcast/Sidecar/${rid}"
            cp -R "$src"/. "GameData/Kerbcast/Sidecar/${rid}/"
          done
          # Executable bits don't survive the artifact zip round-trip; restore
          # them so the plugin can ProcessStartInfo the binaries directly. Both
          # are guaranteed present by the loop above (Windows .exe needs no bit).
          chmod +x GameData/Kerbcast/Sidecar/linux-x64/kerbcast-sidecar
          chmod +x GameData/Kerbcast/Sidecar/osx-arm64/kerbcast-sidecar

          cp hullcam/HullCameraAssets/shaders.linux GameData/Kerbcast/HullcamShaders/
          # Linux keeps the legacy unsuffixed name (pre-multi-platform installs
          # and the loader's fallback both expect it); Windows/macOS get
          # platform suffixes per the HullcamShaders/shaders.linux precedent.
          cp ci/kerbcast-shaders/Bundles-linux/kerbcast-shaders GameData/Kerbcast/
          cp windows-shaders/kerbcast-shaders GameData/Kerbcast/kerbcast-shaders.windows
          cp ci/kerbcast-shaders/Bundles-osx/kerbcast-shaders GameData/Kerbcast/kerbcast-shaders.osx

          cp Plugin/settings.cfg GameData/Kerbcast/

          # kerbcast's own license (CC BY-NC-SA 4.0). The GPL-3.0 notice for the
          # Hullcam-derived shader bundle and the KSP-AVC Kerbcast.version manifest
          # are committed under GameData/Kerbcast/ and travel via the checkout.
          cp LICENSE GameData/Kerbcast/LICENSE

          # PluginData holds user files and the dev marker that turns on a
          # development light speed; neither may ever ship.
          if [ -e GameData/Kerbcast/PluginData ]; then
            echo "::error::GameData/Kerbcast/PluginData must never ship"
            exit 1
          fi

          echo "GameData/Kerbcast tree:"
          find GameData/Kerbcast -type f | sort

      # Assemble the addon's own GameData/KerbcastKos tree. The .version,
      # LICENSE (GPL-3.0) and NOTICE-KOS.txt are committed and arrive via the
      # checkout; only the freshly built DLL is dropped in. Kept as a separate
      # tree so it zips + lists independently of the CC-BY-NC-SA core.
      - name: Assemble GameData/KerbcastKos
        run: |
          set -euo pipefail
          mkdir -p GameData/KerbcastKos/Plugins
          cp Plugin/KerbcastKos/bin/Release/Kerbcast.Kos.dll GameData/KerbcastKos/Plugins/
          echo "GameData/KerbcastKos tree:"
          find GameData/KerbcastKos -type f | sort

      - name: Create release zips
        run: |
          # A dry run on a branch has a ref name like fix/x; keep it a file name.
          TAG="${GITHUB_REF_NAME//\//-}"
          # Core zip: only GameData/Kerbcast (not the whole GameData/, so the
          # addon tree doesn't leak into the core download).
          zip -r "kerbcast-${TAG}.zip" GameData/Kerbcast/
          echo "RELEASE_ZIP=kerbcast-${TAG}.zip" >> $GITHUB_ENV
          # Addon zip: only GameData/KerbcastKos.
          zip -r "KerbcastKos-${TAG}.zip" GameData/KerbcastKos/
          echo "KOS_RELEASE_ZIP=KerbcastKos-${TAG}.zip" >> $GITHUB_ENV

      # Gate on what players actually receive: unzip the core zip into an
      # empty directory and check the library there, not the staging tree.
      - name: Verify the readback library ships in the release zip
        run: Plugin/Vendor/UnityOpenGLAsyncReadback/native/check-zip.sh "${RELEASE_ZIP}" native-readback/build-info.txt

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: kerbcast-release-bundle
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.KOS_RELEASE_ZIP }}
            Plugin/obj/Release/Kerbcast.dll
          if-no-files-found: error

  # KspGonogo.Kerbcast.API and .Testing carry KerbcastApiVersion, the API's own
  # line, so most releases pack a version nuget.org already has. Packed once and
  # gated here; publish-nuget pushes these files, never a re-pack, so what
  # ships is what was gated. Needs no KSP: proving that is the probe's job.
  nuget-pack:
    name: pack and gate the Kerbcast.API packages
    needs: [version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      STABLE: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - uses: actions/checkout@v6

      # An exact SDK, not 8.x: a skipped version is compared with the copy
      # published by an earlier release, and a compiler patch that emits
      # different IL reads as a changed package. Moving this pin means the next
      # release raises KerbcastApiVersion. setup-dotnet only installs a version;
      # dotnet runs the newest SDK on the runner unless a global.json names one.
      # The probe builds outside the checkout, so it uses the runner's newest
      # SDK, as an outside mod would.
      - name: Pin the SDK
        run: echo '{"sdk":{"version":"8.0.427","rollForward":"disable"}}' > global.json

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: The pinned SDK is the one in use
        run: |
          echo "dotnet --version: $(dotnet --version)"
          test "$(dotnet --version)" = 8.0.427

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # A stable tag packs KerbcastApiVersion itself; a pre-release tag, a dry
      # run or a branch packs <KerbcastApiVersion>-rc.<run number>, which is
      # never committed. The two flags keep a rebuild of the same tree
      # comparable with what nuget.org already has.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          API_VER="$(sed -nE 's|.*<KerbcastApiVersion>([^<]*)</KerbcastApiVersion>.*|\1|p' Plugin/Versions.props)"
          if [ "$STABLE" = true ]; then VERSION="$API_VER"; else VERSION="$API_VER-rc.$GITHUB_RUN_NUMBER"; fi
          echo "Packing the Kerbcast.API packages as $VERSION"
          for p in Kerbcast.API Kerbcast.API.Testing; do
            dotnet pack "Plugin/$p/$p.csproj" -c Release -o "$RUNNER_TEMP/nuget" --nologo -warnaserror \
              -p:ContinuousIntegrationBuild=true -p:IncludeSourceRevisionInInformationalVersion=false \
              -p:PackageVersion="$VERSION"
          done
          {
            echo "version=$VERSION"
            echo "api=$RUNNER_TEMP/nuget/KspGonogo.Kerbcast.API.$VERSION.nupkg"
            echo "testing=$RUNNER_TEMP/nuget/KspGonogo.Kerbcast.API.Testing.$VERSION.nupkg"
          } >> "$GITHUB_OUTPUT"

      - name: Gate the packed files
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          API_NUPKG: ${{ steps.pack.outputs.api }}
          TESTING_NUPKG: ${{ steps.pack.outputs.testing }}
        run: |
          if [ "$STABLE" = true ]; then
            node scripts/nuget-package-gate.mjs "$API_NUPKG" "$TESTING_NUPKG"
          else
            node scripts/nuget-package-gate.mjs "$API_NUPKG" "$TESTING_NUPKG" --rc "$VERSION"
          fi

      - name: A mod builds against the packed files without KSP, and the probe can see a gap
        env:
          API_NUPKG: ${{ steps.pack.outputs.api }}
          TESTING_NUPKG: ${{ steps.pack.outputs.testing }}
        run: |
          set -euo pipefail
          node scripts/nuget-extraction-probe.mjs "$API_NUPKG" "$TESTING_NUPKG"
          node scripts/nuget-extraction-probe.mjs "$API_NUPKG" "$TESTING_NUPKG" --plant

      # Fails when nuget.org already has the version with different content: it
      # never replaces a version, so the change could not ship under it.
      - name: Publish or skip, per package
        id: plan
        env:
          API_NUPKG: ${{ steps.pack.outputs.api }}
          TESTING_NUPKG: ${{ steps.pack.outputs.testing }}
        run: node scripts/nuget-registry.mjs plan "$API_NUPKG" "$TESTING_NUPKG"

      - name: Dry run note
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "Dry run, so nothing is pushed. PUBLISH above is what a release from this tree would push, as the stable version on a stable tag." >> "$GITHUB_STEP_SUMMARY"

      # Here rather than in publish-nuget, so a missing secret fails before npm
      # or anything else ships. NuGet/login would otherwise surface it as a
      # bare 401, after the Unity bundle.
      - name: The nuget.org account is configured
        if: steps.plan.outputs.publish != '' && github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::secrets.NUGET_USER is unset. It is the nuget.org profile name (not an email) of the account that owns the ksp-gonogo trusted-publishing policy."
            exit 1
          fi

      # Each .snupkg travels beside its .nupkg; publish-nuget pushes both.
      - uses: actions/upload-artifact@v7
        with:
          name: kerbcast-nuget-packages
          path: |
            ${{ runner.temp }}/nuget/*.nupkg
            ${{ runner.temp }}/nuget/*.snupkg
          if-no-files-found: error

  # nuget.org's trusted-publishing policy for the ksp-gonogo organisation names
  # this repository and this file, with no environment, so any job here holding
  # id-token: write could obtain a key; only this job and publish-sdk hold it.
  # The job exchanges its OIDC token for a one-hour key; there is no stored API
  # key. Only a tag publishes, and it publishes before npm, so a failed push
  # ships nothing.
  publish-nuget:
    name: publish the Kerbcast.API packages to nuget.org
    needs: [nuget-pack, bundle]
    if: (github.event_name == 'push' || inputs.dry_run == false) && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH: ${{ needs.nuget-pack.outputs.publish }}
    steps:
      - uses: actions/checkout@v6

      # The same SDK nuget-pack packed with, pinned the same way.
      - name: Pin the SDK
        run: echo '{"sdk":{"version":"8.0.427","rollForward":"disable"}}' > global.json

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: The pinned SDK is the one in use
        run: |
          echo "dotnet --version: $(dotnet --version)"
          test "$(dotnet --version)" = 8.0.427

      - uses: actions/download-artifact@v8
        with:
          name: kerbcast-nuget-packages
          path: ${{ runner.temp }}/nuget

      - name: Nothing new to publish
        if: env.PUBLISH == ''
        run: |
          echo "SKIP: nuget.org already has the Kerbcast.API packages this release would publish, and nuget-pack found them unchanged"
          echo "Kerbcast.API packages: nothing new to publish, see nuget-pack." >> "$GITHUB_STEP_SUMMARY"

      - name: NuGet login (OIDC to a one-hour key)
        if: env.PUBLISH != ''
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The API before Testing, which depends on it. --skip-duplicate makes a
      # re-run after a partial push go through: nuget.org answers 409 for a
      # version it accepted but has not listed yet, which the flat-container
      # index cannot see. The symbols go as their own push, also with
      # --skip-duplicate, so a re-run retries them when an earlier attempt
      # stopped after the package was accepted. nuget-listed then checks that
      # what nuget.org serves is this artifact.
      - name: Publish to nuget.org
        if: env.PUBLISH != ''
        env:
          DOTNET_CLI_UI_LANGUAGE: en
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          push() {
            dotnet nuget push "$1" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate "${@:2}" 2>&1 | tee "$RUNNER_TEMP/push.log"
          }
          for file in $PUBLISH; do
            name="${file%.nupkg}"
            id="$(printf '%s' "$name" | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+(-.*)?$//')"
            version="${name#"$id".}"
            push "$RUNNER_TEMP/nuget/$file" --no-symbols
            if grep -qi "already exists" "$RUNNER_TEMP/push.log"; then
              echo "SKIP $id $version: nuget.org already had it, from an earlier attempt of this run"
              echo "$id $version: already on nuget.org from an earlier attempt." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PUBLISHED $id $version"
              echo "Published [$id $version](https://www.nuget.org/packages/$id/$version)." >> "$GITHUB_STEP_SUMMARY"
            fi
            push "$RUNNER_TEMP/nuget/$name.snupkg"
            if grep -qi "already exists" "$RUNNER_TEMP/push.log"; then
              echo "SKIP $id $version symbols: nuget.org already had them"
            else
              echo "PUBLISHED $id $version symbols"
            fi
          done

  # nuget.org accepts a push at once but lists it only after validating it, at
  # times twenty minutes later, and a restore in between fails with NU1102. The
  # GitHub Release and SpaceDock wait here so nobody reads about a version they
  # cannot restore yet. Once listed, each version is downloaded and compared
  # with this run's artifact: a push skipped as a duplicate, or a second run
  # racing this one on the same version, must still have shipped these bytes.
  nuget-listed:
    name: nuget.org lists the Kerbcast.API packages
    needs: [nuget-pack, publish-nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PUBLISH: ${{ needs.nuget-pack.outputs.publish }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: kerbcast-nuget-packages
          path: ${{ runner.temp }}/nuget

      - name: Wait until nuget.org lists what was pushed, then check it is this artifact
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH" ]; then
            echo "Nothing was pushed, so there is nothing to wait for"
            exit 0
          fi
          specs=()
          for file in $PUBLISH; do
            name="${file%.nupkg}"
            id="$(printf '%s' "$name" | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+(-.*)?$//')"
            specs+=("$id@${name#"$id".}")
          done
          node scripts/nuget-registry.mjs listed "${specs[@]}" --wait-minutes 45
          for file in $PUBLISH; do
            node scripts/nuget-registry.mjs matches "$RUNNER_TEMP/nuget/$file"
          done

  publish:
    name: GitHub Release + SpaceDock + .ckan pins
    needs: [nuget-pack, publish-sdk, bundle, nuget-listed]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: kerbcast-release-bundle
          path: release-bundle

      - name: Locate release assets
        run: |
          set -euo pipefail
          # Same file-name form as the bundle job's "Create release zips".
          TAG="${GITHUB_REF_NAME//\//-}"
          for f in "kerbcast-${TAG}.zip" "KerbcastKos-${TAG}.zip" "Plugin/obj/Release/Kerbcast.dll"; do
            test -f "release-bundle/$f" || { echo "::error::release bundle is missing $f"; exit 1; }
          done
          mv "release-bundle/kerbcast-${TAG}.zip" "release-bundle/KerbcastKos-${TAG}.zip" .
          {
            echo "RELEASE_ZIP=kerbcast-${TAG}.zip"
            echo "KOS_RELEASE_ZIP=KerbcastKos-${TAG}.zip"
            echo "PLUGIN_DLL=release-bundle/Plugin/obj/Release/Kerbcast.dll"
          } >> "$GITHUB_ENV"

      # No GITHUB_REPO env: cliff.toml uses only local commit data, and
      # setting it makes git-cliff fetch remote metadata it never renders —
      # a transient GitHub API 500 once killed a release at this step.
      # continue-on-error because a missing changelog must not block a
      # release after the expensive Unity builds; the notes fall back to a
      # plain git log below.
      # Span back to the last STABLE tag, not simply the previous one. Cutting
      # v1.9.1-rc.1 before v1.9.1 made --latest cover only rc..final, so the
      # four bug fixes (all of which landed in the rc) vanished from the listing
      # and players saw a release note with no fixes in it. A pre-release is
      # never public, so the range that matters is stable-to-stable.
      - name: Resolve changelog range
        id: clrange
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          PREV_STABLE="$(git tag --sort=-creatordate --merged "${TAG}^" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "$PREV_STABLE" ]; then
            echo "range=${PREV_STABLE}..${TAG}" >> "$GITHUB_OUTPUT"
            echo "changelog range: ${PREV_STABLE}..${TAG}"
          else
            echo "range=" >> "$GITHUB_OUTPUT"
            echo "changelog range: (no previous stable tag, using --latest)"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        continue-on-error: true
        with:
          config: cliff.toml
          args: ${{ steps.clrange.outputs.range != '' && steps.clrange.outputs.range || '--latest' }} --strip all

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIFF_CHANGELOG: ${{ steps.git-cliff.outputs.content }}
          NUGET_PUBLISHED: ${{ needs.nuget-pack.outputs.publish }}
          NUGET_PACKED: ${{ needs.nuget-pack.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # What nuget.org serves for this release: the version just pushed, or
          # when nothing was, the stable API version already out and unchanged.
          if [ -n "${NUGET_PUBLISHED}" ]; then
            NUGET_VER="${NUGET_PACKED}"
          else
            NUGET_VER="$(sed -nE 's|.*<KerbcastApiVersion>([^<]*)</KerbcastApiVersion>.*|\1|p' Plugin/Versions.props)"
          fi
          if [ -z "${CLIFF_CHANGELOG}" ]; then
            PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            CLIFF_CHANGELOG="$(git log --oneline ${PREV_TAG:+${PREV_TAG}..}${TAG})"
          fi
          {
            echo "## Installation"
            echo ""
            echo "1. Extract \`kerbcast-${TAG}.zip\` into your KSP \`GameData/\` directory."
            echo "2. Install Hullcam VDS Continued (required)."
            echo "3. Start KSP and launch a flight with onboard camera parts."
            echo "4. Go to <ksp-ip>:<port> (configured in settings.cfg) to connect to streams."
            echo ""
            echo "## Assets"
            echo "- \`kerbcast-${TAG}.zip\`: complete install tree (plugin + sidecar + shader bundles + settings)"
            echo "- \`Kerbcast.dll\`: plugin DLL only (for manual installs)"
            echo "- \`KerbcastKos-${TAG}.zip\`: optional kOS addon (requires kOS; GPL-3.0). Install alongside kerbcast for kerboscript camera control."
            echo ""
            echo "> TypeScript SDK \`@ksp-gonogo/kerbcast@${TAG#v}\` and \`@ksp-gonogo/kerbcast-react@${TAG#v}\` published to npm."
            echo ""
            echo "> Mods build against \`KspGonogo.Kerbcast.API\` ${NUGET_VER} from nuget.org; tests can use \`KspGonogo.Kerbcast.API.Testing\`."
            echo ""
            echo "<details>"
            echo "<summary>Changelog</summary>"
            echo ""
            echo "${CLIFF_CHANGELOG}"
            echo ""
            echo "</details>"
          } > release-notes.md
          # A tag carrying a pre-release suffix (v1.9.1-rc.1) is a test cut, not
          # a release: mark it so GitHub does not show it as "Latest" and nobody
          # downloads it by accident.
          PRERELEASE_FLAG=""
          case "${TAG}" in *-*) PRERELEASE_FLAG="--prerelease";; esac
          gh release create "${TAG}" \
            "${{ env.RELEASE_ZIP }}" \
            "${{ env.KOS_RELEASE_ZIP }}" \
            "${PLUGIN_DLL}" \
            --title "kerbcast ${TAG}" \
            ${PRERELEASE_FLAG} \
            --notes-file release-notes.md

      # Mirror the release onto SpaceDock so its version list (and the CKAN
      # entry that indexes off SpaceDock) tracks GitHub automatically.
      # SpaceDock has no API tokens; auth is cookie-based, so the credentials
      # live in repo secrets and the mod id in a repo variable. The step skips
      # cleanly until all three are configured. Runs on the tag, before the
      # ckan re-pin switches the working tree to main, so the downloaded zip and
      # Kerbcast.version are still on disk.
      - name: Publish to SpaceDock
        # NOT for pre-releases: SpaceDock feeds the CKAN index, so mirroring an
        # rc would ship a test cut to players.
        if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')
        env:
          SPACEDOCK_USERNAME: ${{ secrets.SPACEDOCK_USERNAME }}
          SPACEDOCK_PASSWORD: ${{ secrets.SPACEDOCK_PASSWORD }}
          SPACEDOCK_MOD_ID: ${{ vars.SPACEDOCK_MOD_ID }}
          CLIFF_CHANGELOG: ${{ steps.git-cliff.outputs.content }}
        run: |
          set -euo pipefail
          if [ -z "${SPACEDOCK_USERNAME:-}" ] || [ -z "${SPACEDOCK_PASSWORD:-}" ] || [ -z "${SPACEDOCK_MOD_ID:-}" ]; then
            echo "::warning::SpaceDock not configured (need secrets SPACEDOCK_USERNAME, SPACEDOCK_PASSWORD and variable SPACEDOCK_MOD_ID); skipping upload"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ZIP="${{ env.RELEASE_ZIP }}"
          GAME_VERSION="$(python3 -c "import json; v=json.load(open('GameData/Kerbcast/Kerbcast.version'))['KSP_VERSION']; print(f\"{v['MAJOR']}.{v['MINOR']}.{v['PATCH']}\")")"
          CHANGELOG="${CLIFF_CHANGELOG}"
          if [ -z "$CHANGELOG" ]; then
            PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            CHANGELOG="$(git log --oneline ${PREV_TAG:+${PREV_TAG}..}${TAG})"
          fi
          # Players read this, not contributors: keep Features and Bug Fixes,
          # acknowledge the rest on one trailer line. Also puts a blank line
          # after each heading so the bullets do not collapse into one line.
          printf '%s\n' "$CHANGELOG" | python3 scripts/spacedock-changelog.py > sd-changelog.md

          # 1) cookie login (SpaceDock has no API tokens)
          login="$(curl -sS -F username="$SPACEDOCK_USERNAME" -F password="$SPACEDOCK_PASSWORD" -c ./sd-cookies https://spacedock.info/api/login)"
          if printf '%s' "$login" | grep -q '"error"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::SpaceDock login failed: $login"; exit 1
          fi
          # 2) upload the new version (multipart)
          resp="$(curl -sS -b ./sd-cookies \
            -F version="$VERSION" \
            -F "changelog=<sd-changelog.md" \
            -F game-version="$GAME_VERSION" \
            -F notify-followers=yes \
            -F zipball=@"$ZIP" \
            "https://spacedock.info/api/mod/${SPACEDOCK_MOD_ID}/update")"
          if printf '%s' "$resp" | grep -q '"error"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::SpaceDock upload failed: $resp"; exit 1
          fi
          rm -f ./sd-cookies sd-changelog.md
          echo "SpaceDock mod ${SPACEDOCK_MOD_ID} updated to ${VERSION} (KSP ${GAME_VERSION})"

      # Mirror the addon onto its own SpaceDock listing (a separate mod: own
      # deps kOS + Kerbcast, own GPL-3.0 licence, so it can't share the core's
      # listing). Same credentials, different mod id in SPACEDOCK_KERBCAST_KOS_ADDON_ID.
      # Skips cleanly until that variable is set, independently of the core
      # SpaceDock step above.
      - name: Publish KerbcastKos to SpaceDock
        # NOT for pre-releases, same as the kerbcast mirror above: SpaceDock
        # feeds the CKAN index, so an rc here reaches players.
        if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')
        env:
          SPACEDOCK_USERNAME: ${{ secrets.SPACEDOCK_USERNAME }}
          SPACEDOCK_PASSWORD: ${{ secrets.SPACEDOCK_PASSWORD }}
          SPACEDOCK_KERBCAST_KOS_ADDON_ID: ${{ vars.SPACEDOCK_KERBCAST_KOS_ADDON_ID }}
          CLIFF_CHANGELOG: ${{ steps.git-cliff.outputs.content }}
        run: |
          set -euo pipefail
          if [ -z "${SPACEDOCK_USERNAME:-}" ] || [ -z "${SPACEDOCK_PASSWORD:-}" ] || [ -z "${SPACEDOCK_KERBCAST_KOS_ADDON_ID:-}" ]; then
            echo "::warning::KerbcastKos SpaceDock not configured (need secrets SPACEDOCK_USERNAME, SPACEDOCK_PASSWORD and variable SPACEDOCK_KERBCAST_KOS_ADDON_ID); skipping addon upload"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ZIP="${{ env.KOS_RELEASE_ZIP }}"
          GAME_VERSION="$(python3 -c "import json; v=json.load(open('GameData/KerbcastKos/KerbcastKos.version'))['KSP_VERSION']; print(f\"{v['MAJOR']}.{v['MINOR']}.{v['PATCH']}\")")"
          CHANGELOG="${CLIFF_CHANGELOG}"
          if [ -z "$CHANGELOG" ]; then
            PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            CHANGELOG="$(git log --oneline ${PREV_TAG:+${PREV_TAG}..}${TAG})"
          fi
          # Players read this, not contributors: keep Features and Bug Fixes,
          # acknowledge the rest on one trailer line. Also puts a blank line
          # after each heading so the bullets do not collapse into one line.
          printf '%s\n' "$CHANGELOG" | python3 scripts/spacedock-changelog.py > sd-kos-changelog.md

          login="$(curl -sS -F username="$SPACEDOCK_USERNAME" -F password="$SPACEDOCK_PASSWORD" -c ./sd-kos-cookies https://spacedock.info/api/login)"
          if printf '%s' "$login" | grep -q '"error"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::SpaceDock login failed: $login"; exit 1
          fi
          resp="$(curl -sS -b ./sd-kos-cookies \
            -F version="$VERSION" \
            -F "changelog=<sd-kos-changelog.md" \
            -F game-version="$GAME_VERSION" \
            -F notify-followers=yes \
            -F zipball=@"$ZIP" \
            "https://spacedock.info/api/mod/${SPACEDOCK_KERBCAST_KOS_ADDON_ID}/update")"
          if printf '%s' "$resp" | grep -q '"error"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::KerbcastKos SpaceDock upload failed: $resp"; exit 1
          fi
          rm -f ./sd-kos-cookies sd-kos-changelog.md
          echo "SpaceDock mod ${SPACEDOCK_KERBCAST_KOS_ADDON_ID} (KerbcastKos) updated to ${VERSION} (KSP ${GAME_VERSION})"

      # Kerbcast.ckan pins an exact version + download URL + hashes for manual
      # .ckan-file installs. The public NetKAN index resolves independently
      # via the SpaceDock listing (see the "Publish to SpaceDock" step above),
      # so this file isn't what CKAN users actually install from, but it goes
      # stale fast if left unpinned (went stale within a day of v0.18.0), so
      # re-pin from the zip we just published. Runs on main, not the tag: the
      # pin must land where users fetch the raw file from.
      - name: Re-pin Kerbcast.ckan + KerbcastKos.ckan on main
        # NOT for pre-releases: these files are what CKAN indexes, so pinning
        # them at an rc advertises a test cut as the current version.
        if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ZIP="${{ env.RELEASE_ZIP }}"
          SIZE="$(stat -c%s "$ZIP")"
          SHA1="$(sha1sum "$ZIP" | awk '{print toupper($1)}')"
          SHA256="$(sha256sum "$ZIP" | awk '{print toupper($1)}')"
          # Addon zip hashes computed before the checkout below discards it.
          KOS_ZIP="${{ env.KOS_RELEASE_ZIP }}"
          KOS_SIZE="$(stat -c%s "$KOS_ZIP")"
          KOS_SHA1="$(sha1sum "$KOS_ZIP" | awk '{print toupper($1)}')"
          KOS_SHA256="$(sha256sum "$KOS_ZIP" | awk '{print toupper($1)}')"

          git fetch origin main
          # The assemble step overwrites tracked files (built shader bundles)
          # in the working tree; nothing there is needed anymore, discard.
          git checkout -f -B main origin/main

          python3 - "$TAG" "$SIZE" "$SHA1" "$SHA256" "$KOS_SIZE" "$KOS_SHA1" "$KOS_SHA256" <<'EOF'
          import json
          import sys
          tag, size, sha1, sha256, kos_size, kos_sha1, kos_sha256 = sys.argv[1:8]
          ver = tag.lstrip("v")

          with open("Kerbcast.ckan") as f:
              m = json.load(f)
          m["version"] = ver
          m["download"] = [
              f"https://github.com/ksp-gonogo/kerbcast/releases/download/{tag}/kerbcast-{tag}.zip"
          ]
          m["download_size"] = int(size)
          m["download_hash"] = {"sha1": sha1, "sha256": sha256}
          with open("Kerbcast.ckan", "w") as f:
              json.dump(m, f, indent=4)
              f.write("\n")

          # Addon: pin its own version, download, hashes, AND the exact Kerbcast
          # dependency version (lockstep — the addon links the plugin facade).
          with open("KerbcastKos.ckan") as f:
              k = json.load(f)
          k["version"] = ver
          k["download"] = [
              f"https://github.com/ksp-gonogo/kerbcast/releases/download/{tag}/KerbcastKos-{tag}.zip"
          ]
          k["download_size"] = int(kos_size)
          k["download_hash"] = {"sha1": kos_sha1, "sha256": kos_sha256}
          for dep in k.get("depends", []):
              if dep.get("name") == "Kerbcast":
                  dep["version"] = ver
          with open("KerbcastKos.ckan", "w") as f:
              json.dump(k, f, indent=4)
              f.write("\n")
          EOF

          if git diff --quiet Kerbcast.ckan KerbcastKos.ckan; then
            echo "Kerbcast.ckan + KerbcastKos.ckan already pin ${TAG}; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Kerbcast.ckan KerbcastKos.ckan
          git commit -m "chore(ckan): pin ${TAG}"
          git push origin main
